[package]
name = "kite"
version = "2.0.0"
description = "Kite — an open-source terminal emulator"
authors = ["kelongyan"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kite_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
ureq = "3"
# Pin the webview: a shared-dep resolution bump (ureq etc.) must not drag
# the renderer to a version the app has never shipped with.
wry = "=0.55.1"
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-log = "2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }
objc2-core-foundation = { version = "0.3", features = [
	# Font enumeration: CFArray iteration, CFString names, CFCharacterSet
	# CJK probe (see modules/fonts.rs).
	"CFArray",
	"CFCharacterSet",
	"CFString",
] }
objc2-core-text = { version = "0.3", features = [
	"CTFont",
	"CTFontCollection",
	"CTFontDescriptor",
	"CTFontTraits",
] }

# WebKitGTK can't read external clipboard copies; mac/win webviews can.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_Graphics_Gdi",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

[profile.release-lowmem]
inherits = "release"
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
